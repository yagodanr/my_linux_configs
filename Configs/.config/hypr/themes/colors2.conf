# Auto generated color theme for Hyprland by wallust
general {
    col.active_border = rgba(3A3355ff) rgba(2F4052ff) 45deg
    col.inactive_border = rgba(697178cc) rgba(96A1ACcc) 45deg
}

group {
    col.border_active = rgba(3A3355ff) rgba(2F4052ff) 45deg
    col.border_inactive = rgba(697178cc) rgba(96A1ACcc) 45deg
    col.border_locked_active = rgba(3A3355ff) rgba(2F4052ff) 45deg
    col.border_locked_inactive = rgba(697178cc) rgba(96A1ACcc) 45deg
}

decoration {
    rounding = 10

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}