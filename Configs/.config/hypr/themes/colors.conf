# Auto generated color theme for Hyprland by wallust
general {
    col.active_border = rgba(6C352Aff) rgba(B0392Fff) 45deg
    col.inactive_border = rgba(AD9C80cc) rgba(F6E0B7cc) 45deg
}

group {
    col.border_active = rgba(6C352Aff) rgba(B0392Fff) 45deg
    col.border_inactive = rgba(AD9C80cc) rgba(F6E0B7cc) 45deg
    col.border_locked_active = rgba(6C352Aff) rgba(B0392Fff) 45deg
    col.border_locked_inactive = rgba(AD9C80cc) rgba(F6E0B7cc) 45deg
}

decoration {
    rounding = 10

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}