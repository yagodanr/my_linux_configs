# Auto generated color theme for Hyprland by wallust
general {
    col.active_border = rgba(594E9Aff) rgba(C9619Fff) 45deg
    col.inactive_border = rgba(9D9092cc) rgba(E1CED0cc) 45deg
}

group {
    col.border_active = rgba(594E9Aff) rgba(C9619Fff) 45deg
    col.border_inactive = rgba(9D9092cc) rgba(E1CED0cc) 45deg
    col.border_locked_active = rgba(594E9Aff) rgba(C9619Fff) 45deg
    col.border_locked_inactive = rgba(9D9092cc) rgba(E1CED0cc) 45deg
}

decoration {
    rounding = 10

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}